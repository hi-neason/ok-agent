spring:
  config:
    import: optional:file:../config/application-local.yml
  application:
    name: ok-agent-server
  datasource:
    url: ${OK_AGENT_DB_URL:jdbc:mysql://127.0.0.1:3306/ok_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${OK_AGENT_DB_USERNAME:root}
    password: ${OK_AGENT_DB_PASSWORD:root123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
ok-agent:
  security:
    bootstrap-admin:
      username: ${OK_AGENT_BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${OK_AGENT_BOOTSTRAP_ADMIN_PASSWORD:}
    jwt:
      ttl: ${OK_AGENT_JWT_TTL:30m}
  observe:
    trace-retention-days: ${OK_AGENT_TRACE_RETENTION_DAYS:30}
    trace-cleanup-cron: "${OK_AGENT_TRACE_CLEANUP_CRON:0 17 3 * * *}"
  runtime:
    agentscope-version: ${AGENTSCOPE_VERSION:2.0.2}
  storage:
    jdbc-url: ${OK_AGENT_JDBC_URL:}

logging:
  level:
    io.agentscope: DEBUG
    io.okagent.service.agent: DEBUG
